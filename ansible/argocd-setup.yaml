- name: ArgoCD 셋업
  hosts: main-master
  become: false
  tasks:
    - name: ArgoCD용 Namespace 생성
      kubernetes.core.k8s:
        name: "argocd"
        kind: Namespace
        state: present
        kubeconfig: /home/ec2-user/.kube/config

    - name: ArgoCD Helm 리포지토리 추가
      kubernetes.core.helm_repository:
        name: argo
        repo_url: "https://argoproj.github.io/argo-helm"

    - name: Helm 리포지토리 업데이트
      command: helm repo update

    # LBC webhook delete workaround 제거: main.yaml 에서 nlb-setup.yaml 자체를 제거했으므로
    # mservice.elbv2.k8s.aws / vservice.elbv2.k8s.aws webhook 가 처음부터 등록 안 됨.

    - name: ArgoCD 설치
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        release_namespace: "argocd"
        create_namespace: true
        wait: true
        values:
          server:
            service:
              type: NodePort
              # 외부 NLB 표준 진입점 = Istio Gateway (30080 http + 30443 https).
              # ArgoCD chart 의 nodePort 가 명시 안 되면 chart default 가 그 표준 port
              # 와 우연히 충돌 (http=30080, https=30443) → ArgoCD 가 먼저 sync 되어
              # port 점유 → Istio Gateway Service Invalid → ingressgateway 안 뜸.
              # ArgoCD UI 는 운영 진입 (--insecure 모드라 https 사실상 안 씀) → 두 port
              # 모두 양보. http 30090 / https 30493.
              nodePorts:
                http: 30090
                https: 30493
            extraArgs:
              - --insecure

    - name: CRD 존재 확인
      kubernetes.core.k8s_info:
        kind: CustomResourceDefinition
        name: applications.argoproj.io
      register: crd_info
      until: crd_info.resources | length > 0
      retries: 10
      delay: 5

    - name: 매니페스트 레포의 root-app.yaml 다운로드
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/kjylab/ktcloud-k8s-argocd-manifest/main/bootstrap/root-app.yaml
        dest: /tmp/root-app.yaml
        mode: "0644"

    - name: ArgoCD root Application 생성 (app-of-apps 진입점)
      kubernetes.core.k8s:
        state: present
        src: /tmp/root-app.yaml
        kubeconfig: /home/ec2-user/.kube/config
